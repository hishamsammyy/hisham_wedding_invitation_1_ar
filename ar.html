<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>دعوة فرح هشام و بسنت</title>
<meta name="description" content="في دعوة مستخبية تحت اللمعة… المسها وشوف">
<meta property="og:title" content="دعوة فرح هشام و بسنت 💍">
<meta property="og:description" content="في دعوة مستخبية تحت اللمعة… المسها وشوف ✨">
<meta name="theme-color" content="#2a0006">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#7a0010;
  --velvet-dark:#2a0006;
  --blood:#b3001b;
  --gold:#e9c98b;
  --cream:#fff3e6;
  --night:#0b0204;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--cream)}
body{font-family:"Amiri",serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden;height:100vh;height:calc(var(--vh,1vh) * 100);touch-action:none}

/* =================== المسرح =================== */
.stage{
  position:relative;height:100vh;height:calc(var(--vh,1vh) * 100);min-height:560px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 70% 45% at 50% 78%, rgba(255,90,110,.25), transparent 70%),
    radial-gradient(ellipse 90% 60% at 50% 20%, #3a0710 0%, #160205 60%, #070102 100%);
}
/* دخان */
.smoke{position:absolute;top:-20%;right:-20%;bottom:-20%;left:-20%;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:screen;
  background:
    radial-gradient(closest-side at 30% 60%, rgba(255,120,140,.18), transparent),
    radial-gradient(closest-side at 70% 45%, rgba(255,160,170,.14), transparent),
    radial-gradient(closest-side at 50% 80%, rgba(255,100,120,.2), transparent);
  filter:blur(30px);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}

/* شعاع السبوت لايت */
.beam{position:absolute;z-index:2;top:-10%;left:50%;width:120vmin;height:115%;transform:translateX(-50%) rotate(14deg);transform-origin:50% 0;
  pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity 2s ease 1.2s;
  background:linear-gradient(180deg,rgba(255,225,230,.55),rgba(255,160,175,.18) 60%,transparent 95%);
  clip-path:polygon(47% 0,53% 0,72% 100%,28% 100%);filter:blur(6px)}
.beam.b2{transform:translateX(-50%) rotate(-16deg);opacity:0;background:linear-gradient(180deg,rgba(255,200,210,.35),rgba(255,120,140,.1) 60%,transparent 95%)}
.open .beam{opacity:.75}.open .beam.b2{opacity:.45}

#dust{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}

/* الأرضية والدائرة المضيئة */
.floor{position:absolute;z-index:3;left:50%;bottom:calc(var(--vh,1vh) * 6);width:min(88vw,430px);height:calc(min(88vw,430px) / 3.2);transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,200,210,.35),rgba(255,90,110,.08) 60%,transparent 72%)}
.floor::after{content:"";position:absolute;top:8%;bottom:8%;left:6%;right:6%;border-radius:50%;border:2px solid rgba(255,200,210,.85);
  box-shadow:0 0 18px rgba(255,120,140,.9),inset 0 0 18px rgba(255,120,140,.6);opacity:0;transition:opacity 1.5s ease 1.6s}
.open .floor::after{opacity:1}

/* العروسين */
.couple{position:absolute;z-index:4;left:50%;bottom:calc(calc(var(--vh,1vh) * 6) + min(88vw,430px)/3.2*.42);width:min(58vw,250px);
  transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(0 0 16px rgba(255,170,185,.5))}
.couple svg{width:100%;height:auto;display:block;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg) translateX(-2%)}50%{transform:rotate(2deg) translateX(2%)}}

/* النصوص فوق المسرح */
.heading::before{content:"";position:absolute;left:-12%;right:-12%;top:-28px;bottom:-34px;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.6s ease;
  background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(14,0,4,.62),rgba(14,0,4,.3) 60%,transparent 78%)}
.show-text .heading::before{opacity:1}
.heading{position:absolute;z-index:10;top:calc(calc(var(--vh,1vh) * 9) + 6px);left:0;right:0;text-align:center;padding:0 16px}

/* ===== أنيميشن الكلام ===== */
.split .ch{display:inline-block;opacity:0;transform:translateY(.45em);filter:blur(8px);white-space:pre}
.split.play .ch{animation:chIn .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * var(--sp,140ms) + var(--d,0ms))}
@keyframes chIn{60%{filter:blur(0);opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}

.write{position:relative;display:inline-block;-webkit-clip-path:inset(-80% -40% -80% 100%);clip-path:inset(-80% -40% -80% 100%);padding:0 .12em}
.write.play{animation:writeIn 1.8s cubic-bezier(.45,.05,.35,1) forwards, glowPulse 3.2s ease-in-out 2.2s infinite}
@keyframes writeIn{to{-webkit-clip-path:inset(-80% -40% -80% -40%);clip-path:inset(-80% -40% -80% -40%)}}
.write.done{-webkit-clip-path:none!important;clip-path:none!important}
@keyframes glowPulse{50%{text-shadow:0 0 14px rgba(255,255,255,.9),0 0 34px rgba(255,120,145,1),0 0 70px rgba(255,60,90,.8)}}
.pen{position:absolute;top:50%;left:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;opacity:0;
  background:#fff;box-shadow:0 0 10px 4px #fff,0 0 26px 10px rgba(255,120,150,.9)}
.write.play + .pen, .pen.play{animation:penMove 1.8s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes penMove{0%{opacity:1;left:100%;transform:translateY(-14px)}25%{transform:translateY(10px)}50%{transform:translateY(-10px)}75%{transform:translateY(8px)}95%{opacity:1}100%{opacity:0;left:0;transform:translateY(0)}}
.namebox{position:relative;display:inline-block}

.pop{opacity:0;transform:scale(.3) rotate(-20deg)}
.pop.play{animation:popIn 1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes popIn{to{opacity:1;transform:none}}

.line-draw{transform:scaleX(0);transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.line-draw.play{transform:none}

.cd b.tick{animation:tickA .45s ease}
@keyframes tickA{0%{transform:translateY(-40%);opacity:0}100%{transform:none;opacity:1}}

.small{font-family:"Amiri",serif;font-size:clamp(17px,4.6vw,21px);color:#ffe1e6;opacity:.95}
.name{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(38px,min(13vw,calc(var(--vh,1vh) * 9)),70px);line-height:1.12;color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.7),0 0 26px rgba(255,120,145,.9),0 0 50px rgba(255,60,90,.6)}
.amp{font-family:"Aref Ruqaa",serif;font-size:clamp(30px,8vw,40px);color:var(--gold);line-height:1;margin:2px 0;
  text-shadow:0 0 12px rgba(233,201,139,.8)}
.date-line{margin-top:10px;font-family:"Reem Kufi",sans-serif;word-spacing:6px;font-size:clamp(17px,4.8vw,21px);color:#fff;
  text-shadow:0 0 12px rgba(255,140,160,.8)}
.place{font-family:"Amiri",serif;font-size:clamp(16px,4.4vw,19px);color:#ffd9df;margin-top:2px}

.scroll-hint{position:absolute;z-index:6;bottom:max(calc(var(--vh,1vh) * 1.5),env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-family:"Reem Kufi",sans-serif;font-size:11px;color:rgba(255,220,225,.7);opacity:0;transition:opacity 1s ease 3.5s;text-align:center}
.scroll-hint span{display:block;font-size:18px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.show-text .scroll-hint{opacity:1;transition-delay:6s}

/* =================== الستارة =================== */
.curtain{position:absolute;top:0;bottom:0;width:53%;z-index:8;pointer-events:none;
  transition:transform 3.2s cubic-bezier(.65,.02,.25,1);
  background:
    linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 80%,rgba(0,0,0,.55)),
    repeating-linear-gradient(90deg,
      #3d0008 0px,#7d0012 10px,#b0061f 20px,#d4142e 25px,#a3041b 32px,#5c000c 44px,#3d0008 52px);
  box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.curtain.left{left:0;transform-origin:0 50%}
.curtain.right{right:0;transform-origin:100% 50%}
/* اللمعة على القماش */
.curtain::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse 60% 40% at 50% 40%,rgba(255,180,190,.18),transparent 70%);mix-blend-mode:screen}
.open .curtain.left{transform:translateX(-14%) scaleX(.32)}
.open .curtain.right{transform:translateX(14%) scaleX(.32)}
.valance{position:absolute;top:0;left:-2%;right:-2%;height:calc(var(--vh,1vh) * 9);z-index:9;pointer-events:none;
  background:
    radial-gradient(ellipse 50% 100% at 50% 0,transparent 0,transparent 0) ,
    repeating-linear-gradient(90deg,#4a000a 0,#9d0619 14px,#c81029 20px,#7a000f 30px,#4a000a 40px);
  -webkit-mask:radial-gradient(ellipse 34px 26px at 34px 100%,transparent 98%,#000 100%) 0 0/68px 100% repeat-x;
          mask:radial-gradient(ellipse 34px 26px at 34px 100%,transparent 98%,#000 100%) 0 0/68px 100% repeat-x;
  box-shadow:0 8px 20px rgba(0,0,0,.6)}
.valance::after{content:"";position:absolute;left:0;right:0;bottom:24px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}

/* =================== اللمعة (أول شاشة) =================== */
#glitter{position:fixed;top:0;left:0;z-index:30;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity 1.4s ease}
#glitter.gone{opacity:0;pointer-events:none}
.glitter-ui{position:fixed;top:0;right:0;bottom:0;left:0;z-index:31;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:max(calc(var(--vh,1vh) * 9),env(safe-area-inset-top)) 16px max(calc(var(--vh,1vh) * 10),env(safe-area-inset-bottom));text-align:center;transition:opacity .8s ease}
.glitter-ui.gone{opacity:0}
.g-top{font-family:"Amiri",serif;font-size:clamp(19px,5.2vw,23px);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.g-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.g-call{font-family:"Aref Ruqaa",serif;font-size:clamp(44px,13vw,60px);color:#fff;
  text-shadow:0 0 14px rgba(255,255,255,.6),0 0 30px rgba(255,80,110,.8)}
.g-sub{font-family:"Reem Kufi",sans-serif;font-size:18px;color:#fff;padding:8px 26px;border-radius:40px;border:1.5px solid rgba(255,255,255,.75);background:rgba(40,0,8,.35);box-shadow:0 0 18px rgba(255,120,150,.45);margin-top:4px}
.finger{position:relative;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 22px 6px rgba(255,255,255,.55);
  animation:tap 1.8s ease-in-out infinite}
.finger::after{content:"";position:absolute;top:-6px;right:-6px;bottom:-6px;left:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:ring 1.8s ease-out infinite}
@keyframes tap{0%,100%{transform:scale(1)}20%{transform:scale(.8)}40%{transform:scale(1)}}
@keyframes ring{0%,15%{transform:scale(.8);opacity:0}25%{opacity:1}100%{transform:scale(2.4);opacity:0}}
#skip{pointer-events:auto;background:none;border:0;color:rgba(255,220,225,.75);font-family:"Reem Kufi",sans-serif;font-size:13px;
  text-decoration:underline;cursor:pointer;opacity:0;transition:opacity 1s}
#skip.visible{opacity:1}

/* =================== التفاصيل تحت =================== */
.details{position:relative;padding:0 16px;text-align:center;
  background:linear-gradient(180deg,#070102 0%,#1a0307 40%,#2a0509 100%)}
.details::before{content:"";position:absolute;top:0;left:0;right:0;height:70px;background:linear-gradient(180deg,#070102,transparent)}
.wrap{max-width:520px;margin:0 auto}
.reveal{opacity:0;transform:translateY(22px);transition:opacity 1s ease, transform 1s ease}
.reveal.in{opacity:1;transform:none}

.bism{font-family:"Aref Ruqaa",serif;color:var(--gold);font-size:26px;line-height:1.7}
.verse{margin-top:10px;font-size:18px;line-height:2.1;color:#ffdfe4}
.verse{font-size:21px;line-height:2.2}
.verse-ref{display:block;margin-top:6px;font-family:"Reem Kufi",sans-serif;font-size:12px;color:var(--gold);opacity:.85}
.closing-sign{margin-top:6px}
/* كل جزء صفحة كاملة لوحده */
.stop{min-height:100vh;min-height:calc(var(--vh,1vh) * 100);display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.stop > .orn:first-child{margin-top:0}
figure.stop.portrait{margin:0 auto;align-items:center}
figure.stop.portrait .frame{max-width:330px;width:100%}

/* ===== الصورة في الآخر ===== */
.portrait{margin:48px auto 0;max-width:330px;opacity:0;transform:translateY(40px) scale(.92);filter:blur(12px);
  transition:opacity 1.6s ease, transform 1.6s cubic-bezier(.2,.7,.2,1), filter 1.6s ease}
.portrait.in{opacity:1;transform:none;filter:none}
.portrait .frame{position:relative;padding:7px;border-radius:200px 200px 22px 22px;overflow:hidden;
  background:linear-gradient(160deg,#f6e3b4,#b8914a 35%,#f3dca6 55%,#9c7638 80%,#e9c98b);
  box-shadow:0 0 0 1px rgba(255,220,160,.4),0 0 45px rgba(255,70,105,.45),0 25px 60px rgba(0,0,0,.55)}
.portrait img{display:block;width:100%;height:auto;border-radius:194px 194px 16px 16px;background:#1a0307}
.portrait .frame::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0}
.portrait.in .frame::after{animation:sheen 2.4s ease 1.3s forwards}
@keyframes sheen{to{background-position:-60% 0}}
.portrait figcaption{margin-top:16px;font-family:"Aref Ruqaa",serif;font-size:34px;color:#fff;text-shadow:0 0 16px rgba(255,90,120,.8)}


.orn{margin:34px auto;width:180px;height:14px;color:var(--gold);opacity:.8}

.families{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;font-size:19px;line-height:1.5}
.families .who{font-family:"Reem Kufi",sans-serif;font-size:12px;color:var(--gold);display:block;margin-bottom:6px}
.families .full{color:#fff}
.families .heart{align-self:center;color:#ff6b84;font-size:22px;text-shadow:0 0 12px #ff3a5c}

.invite-text{margin-top:30px;font-size:21px;line-height:2;color:#ffe6ea}

.date-card{margin:30px auto 0;max-width:360px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;font-family:"Reem Kufi",sans-serif}
.date-card .side{position:relative;border-top:1px solid rgba(233,201,139,.6);border-bottom:1px solid rgba(233,201,139,.6);padding:9px 0;font-size:17px;color:#fff}
.date-card .num{font-size:64px;font-weight:600;line-height:1;color:#fff;text-shadow:0 0 18px rgba(255,90,120,.8)}
.date-card .mon{font-size:15px;color:var(--gold);margin-top:4px}
.time{margin-top:10px;color:#ffd9df;font-size:17px}
.time:empty{display:none}

.countdown{display:flex;justify-content:center;gap:9px;margin-top:30px}
.cd{width:74px;padding:13px 0 9px;border-radius:14px;font-family:"Reem Kufi",sans-serif;
  background:linear-gradient(180deg,rgba(179,0,27,.35),rgba(60,0,10,.5));box-shadow:inset 0 0 0 1px rgba(255,140,160,.35),0 8px 24px rgba(0,0,0,.4)}
.cd b{display:block;font-size:27px;font-weight:600;color:#fff}
.cd small{font-size:12px;color:#ffc9d2}
.cd-done{font-family:"Aref Ruqaa",serif;font-size:42px;color:#fff;text-shadow:0 0 20px #ff3a5c}

.venue h3{font-family:"Aref Ruqaa",serif;font-weight:400;font-size:46px;color:#fff;text-shadow:0 0 16px rgba(255,90,120,.7)}
.venue p{margin-top:4px;color:#ffd9df;font-size:17px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.btn{font-family:"Reem Kufi",sans-serif;font-size:15px;text-decoration:none;cursor:pointer;border:0;color:#fff;
  padding:13px 20px;border-radius:40px;display:inline-flex;align-items:center;gap:8px;transition:transform .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#d4142e,#8a0014);box-shadow:0 8px 22px rgba(212,20,46,.45)}
.btn.ghost{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1.5px rgba(255,200,210,.55)}

.closing{margin-top:44px;font-size:19px;line-height:2;color:#ffe6ea}
.closing b{display:block;font-family:"Aref Ruqaa",serif;font-weight:400;font-size:40px;color:#fff;text-shadow:0 0 16px rgba(255,90,120,.8)}
footer{text-align:center;padding:30px 16px 36px;font-family:"Reem Kufi",sans-serif;font-size:12px;color:rgba(255,200,210,.45);background:#2a0509}

#music{position:fixed;bottom:16px;left:16px;z-index:40;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:none;
  background:rgba(179,0,27,.85);color:#fff;font-size:19px;box-shadow:0 0 18px rgba(255,60,90,.6)}
#music.on{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* لو الأنيميشن مااشتغلش لأي سبب، الدعوة تظهر عادي */
.failsafe #glitter,.failsafe .glitter-ui{display:none!important}
.failsafe .ch,.failsafe .write,.failsafe .pop,.failsafe .reveal,.failsafe .line-draw{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;-webkit-clip-path:none!important}
.failsafe .curtain.left{transform:translateX(-14%) scaleX(.32)}.failsafe .curtain.right{transform:translateX(14%) scaleX(.32)}
@media (max-height:700px){.couple{width:min(44vw,180px)}}
@media (prefers-reduced-motion: reduce){
  .couple svg,.smoke,.scroll-hint span,.finger{animation:none}
}
</style>
</head>
<body class="locked">

  <div class="beam"></div>

  <div class="floor"></div>

  <div class="couple" aria-hidden="true">
    <!-- عريس وعروسة بيرقصوا (رسم أصلي) -->
    <svg viewBox="0 0 200 300">
      <defs>
        <linearGradient id="gown" x1="0" y1="0" x2="0" y2="1">

        </linearGradient>
        <radialGradient id="rim" cx=".5" cy=".3" r=".7">
          <stop offset="0" stop-color="#ffd6de" stop-opacity=".9"/>
          <stop offset="1" stop-color="#ffd6de" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- العريس -->
      <g fill="url(#suit)">
        <path d="M79 288 L83 196 L78 150 Q76 112 82 96 Q88 86 100 88 L104 104 L106 150 L102 196 L99 288 Z"/>
        <path d="M70 288 L76 200 L78 160 L86 160 L84 200 L80 288 Z"/>
        <!-- إيد العريس على وسط العروسة -->
        <path d="M100 104 Q116 112 124 126 L120 130 Q110 120 98 116 Z"/>
        <!-- الدراع الممدودة ماسكة إيدها -->
        <path d="M82 100 Q66 92 58 74 L63 71 Q72 86 86 92 Z"/>
      </g>
      <circle cx="91" cy="76" r="11.5" fill="#1c1416"/>
      <path d="M80 72 Q84 60 96 62 Q103 64 102 72 Q94 66 84 74 Z" fill="#0a0607"/>
      <!-- لمعة على حافة العريس -->
      <path d="M100 90 L105 104 L106 150 L102 196 L99 288" stroke="#ffb3c1" stroke-width="1.2" fill="none" opacity=".55"/>

      <!-- العروسة -->
      <!-- الفستان -->
      <path d="M112 132 Q118 128 126 132 Q150 190 182 278 Q186 290 170 292 Q132 298 94 292 Q80 290 84 280 Q102 200 112 132 Z" fill="url(#gown)"/>
      <path d="M118 140 Q128 210 150 290" stroke="#f0b4c2" stroke-width="1" fill="none" opacity=".6"/>
      <path d="M116 140 Q112 210 108 292" stroke="#f0b4c2" stroke-width="1" fill="none" opacity=".5"/>
      <!-- الجسم -->
      <path d="M112 134 Q110 112 114 100 Q118 92 124 94 Q130 98 128 112 L126 134 Z" fill="#fff"/>
      <!-- الدراع اللي فوق كتف العريس -->
      <path d="M116 100 Q104 92 96 92 L95 97 Q106 98 114 106 Z" fill="#fde2e8"/>
      <!-- الدراع الممدودة -->
      <path d="M118 100 Q90 80 62 72 L60 76 Q88 86 116 106 Z" fill="#fde2e8" opacity="0"/>
      <!-- الراس والطرحة -->

<script>
const $ = id => document.getElementById(id);
const target = new Date(WEDDING.date);

/* ---------------- تقسيم الكلام لحروف ---------------- */
document.querySelectorAll(".split").forEach(el=>{
  const txt=el.textContent; el.textContent=""; el.setAttribute("aria-label",txt);
  let i=0;
  txt.split(/(\s+)/).forEach(word=>{
    if(!word) return;
    if(/^\s+$/.test(word)){el.append(" ");return}
    const w=document.createElement("span");w.className="ch";w.textContent=word;w.setAttribute("aria-hidden","true");
    w.style.setProperty("--i",i++);el.append(w);
  });
  if(el.dataset.sp) el.style.setProperty("--sp",el.dataset.sp+"ms");
  if(el.dataset.d) el.style.setProperty("--d",el.dataset.d+"ms");
});
const play=el=>{if(el.classList.contains("write")&&!el.dataset.w){el.dataset.w=1;el.addEventListener("animationend",ev=>{if(ev.animationName==="writeIn")el.classList.add("done")})}el.classList.add("play");const pen=el.nextElementSibling;if(el.classList.contains("write")&&pen&&pen.classList.contains("pen"))pen.classList.add("play")};

/* العروسين ياخدوا المساحة الفاضية تحت الكلام بس — مايدخلوش عليه في أي شاشة */
function fitCouple(){
  const c=document.querySelector(".couple"), h=document.querySelector(".heading");
  c.style.width="";
  const hr=h.getBoundingClientRect(), cr=c.getBoundingClientRect();
  const avail=cr.bottom-(hr.bottom+14);
  if(cr.height>avail) c.style.width=Math.max(70,avail*200/300)+"px";
}
fitCouple();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitCouple);
addEventListener("load",fitCouple);
addEventListener("resize",()=>setTimeout(fitCouple,120));

/* تسلسل الكلام على المسرح */
function playHero(){
  fitCouple();
  const seq=[["h-families",0],["h-groom",900],["h-amp",2500],["h-bride",3000],["h-invite",4700],["h-date",5900],["h-place",6700]];
  seq.forEach(([id,t])=>setTimeout(()=>play($(id)),t));
  const [lastId,lastT]=seq[seq.length-1];
  setTimeout(startTour, lastT + estimate($(lastId)) + PAUSE);   // ٣ ثواني بعد ما الكتابة تخلص
}

/* ---------------- غبار لامع فوق المسرح ---------------- */
const dust=$("dust"), dctx=dust.getContext("2d");
let motes=[];
function sizeDust(){const r=devicePixelRatio||1;dust.width=dust.clientWidth*r;dust.height=dust.clientHeight*r;dctx.setTransform(r,0,0,r,0,0)}
function initMotes(){motes=Array.from({length:90},()=>({x:Math.random()*dust.clientWidth,y:Math.random()*dust.clientHeight,
  r:Math.random()*1.6+.3,vy:Math.random()*.35+.08,vx:(Math.random()-.5)*.2,t:Math.random()*6}))}
function drawDust(){
  const w=dust.clientWidth,h=dust.clientHeight;dctx.clearRect(0,0,w,h);
  for(const m of motes){m.y+=m.vy;m.x+=m.vx;m.t+=.03;if(m.y>h){m.y=-4;m.x=Math.random()*w}
    const a=.35+.45*Math.sin(m.t);dctx.fillStyle=`rgba(255,${200+Math.sin(m.t)*40|0},210,${a})`;
    dctx.beginPath();dctx.arc(m.x,m.y,m.r,0,7);dctx.fill()}
  requestAnimationFrame(drawDust);
}
sizeDust();initMotes();drawDust();

/* ---------------- اللمعة اللي بتتمسح ---------------- */
const cv=$("glitter"), ctx=cv.getContext("2d");
let W,H,DPR, base, mask, mctx, sparks=[], falling=[], cleared=false, grid, gridN=0, gridHit=0;
const CELL=28;

function buildGlitter(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  base=document.createElement("canvas");base.width=W*DPR;base.height=H*DPR;
  const b=base.getContext("2d");b.setTransform(DPR,0,0,DPR,0,0);
  const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,"#5a0010");g.addColorStop(.5,"#8a0016");g.addColorStop(1,"#4a000c");
  b.fillStyle=g;b.fillRect(0,0,W,H);
  // حبيبات لمعة
  const n=Math.floor(W*H/9);
  for(let i=0;i<n;i++){
    const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.6+.4,c=Math.random();
    b.fillStyle = c<.55?`rgba(${180+Math.random()*75|0},${Math.random()*30|0},${20+Math.random()*30|0},.9)`
                : c<.85?`rgba(255,${60+Math.random()*80|0},${80+Math.random()*60|0},.8)`
                : `rgba(255,${200+Math.random()*55|0},${200+Math.random()*55|0},.9)`;
    b.fillRect(x,y,r,r);
  }
  mask=document.createElement("canvas");mask.width=W*DPR;mask.height=H*DPR;mctx=mask.getContext("2d");mctx.setTransform(DPR,0,0,DPR,0,0);
  sparks=Array.from({length:Math.floor(W*H/1400)},()=>({x:Math.random()*W,y:Math.random()*H,t:Math.random()*6,s:Math.random()*.08+.03,r:Math.random()*1.8+.6}));
  const cols=Math.ceil(W/CELL),rows=Math.ceil(H/CELL);grid=new Uint8Array(cols*rows);gridN=cols*rows;gridHit=0;grid.cols=cols;
}
function star(c,x,y,r,a){
  c.globalAlpha=a;c.fillStyle="#fff";c.beginPath();c.arc(x,y,r*.6,0,7);c.fill();
  c.fillRect(x-r*2.2,y-.4,r*4.4,.8);c.fillRect(x-.4,y-r*2.2,.8,r*4.4);c.globalAlpha=1;
}
function renderGlitter(){
  if(cv.classList.contains("gone")) return;
  ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,W,H);
  ctx.drawImage(base,0,0,W,H);
  for(const s of sparks){s.t+=s.s;const a=Math.max(0,Math.sin(s.t));if(a>.05)star(ctx,s.x,s.y,s.r,a)}
  ctx.globalCompositeOperation="destination-out";ctx.drawImage(mask,0,0,W,H);
  ctx.globalCompositeOperation="source-over";
  // حبيبات بتقع
  for(let i=falling.length-1;i>=0;i--){const p=falling[i];p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.life-=.012;
    if(p.life<=0||p.y>H+10){falling.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r)}
  ctx.globalAlpha=1;
  requestAnimationFrame(renderGlitter);
}
function spill(x,y,n){
  for(let i=0;i<n;i++)falling.push({x:x+(Math.random()-.5)*40,y:y+(Math.random()-.5)*40,vx:(Math.random()-.5)*3,vy:Math.random()*-2,
    r:Math.random()*2+1,life:1,c:Math.random()<.2?"#fff":`hsl(${350+Math.random()*12},90%,${40+Math.random()*25}%)`});
}
let touched=false;
/* لمسة واحدة: اللمعة بتتنفخ من مكان الصباع وتكشف الستارة */
function burst(x,y,n){
  for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,sp=Math.random()*9+3;
    falling.push({x:x+Math.cos(ang)*Math.random()*30,y:y+Math.sin(ang)*Math.random()*30,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-2,
      r:Math.random()*2.4+1,life:1,c:Math.random()<.25?"#fff":`hsl(${350+Math.random()*12},90%,${40+Math.random()*30}%)`})}
}
function dissolve(x,y){
  const maxR=Math.hypot(Math.max(x,W-x),Math.max(y,H-y))+40, t0=performance.now(), dur=1400;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=k*k*(3-2*k), r=maxR*e;
    mctx.fillStyle="#000";mctx.beginPath();mctx.arc(x,y,r,0,7);mctx.fill();
    // حبيبات على حافة الدايرة بتطير لبرا
    if(k<1){for(let i=0;i<14;i++){const ang=Math.random()*Math.PI*2,px=x+Math.cos(ang)*r,py=y+Math.sin(ang)*r;
      if(px>-10&&px<W+10&&py>-10&&py<H+10)falling.push({x:px,y:py,vx:Math.cos(ang)*(Math.random()*5+2),vy:Math.sin(ang)*(Math.random()*5+2),
        r:Math.random()*2+1,life:1,c:Math.random()<.25?"#fff":`hsl(${352+Math.random()*10},90%,${45+Math.random()*25}%)`})}
      requestAnimationFrame(step)}
  })(t0);
}
function onTouch(e){
  if(touched) return; touched=true; startAudio();
  const x=(e&&e.clientX!=null)?e.clientX:W/2, y=(e&&e.clientY!=null)?e.clientY:H/2;
  $("gui").classList.add("gone"); burst(x,y,120); dissolve(x,y); reveal();
}
cv.addEventListener("pointerdown",onTouch);
cv.addEventListener("touchstart",e=>onTouch(e.touches&&e.touches[0]),{passive:true});
cv.addEventListener("mousedown",onTouch);
cv.addEventListener("click",onTouch);
addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")onTouch({clientX:W/2,clientY:H/2})});

function reveal(){
  if(cleared) return; cleared=true; touched=true;
  setTimeout(()=>cv.classList.add("gone"),1500);                                  // اللمعة اختفت → الستارة مقفولة
  setTimeout(()=>{document.body.classList.add("open")},2000);                     // الستارة تتفتح
  setTimeout(()=>{document.body.classList.add("show-text");playHero()},3300);      // الكلام يبدأ مع فتح الستارة
  setTimeout(()=>{document.body.classList.remove("locked");cv.remove();$("gui").remove()},5200);
}
buildGlitter();renderGlitter();
let rT;addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{sizeDust();if(!touched)buildGlitter()},200)});

/* ---------------- موسيقى ---------------- */
let audio=null, wantPlay=false;
if(WEDDING.music){
  audio=document.createElement("audio");audio.loop=true;audio.preload="auto";audio.setAttribute("playsinline","");
  const m=WEDDING.music, hasExt=/\.[a-z0-9]{2,4}$/i.test(m);
  const list=hasExt?[m]:[".mp3",".m4a",".wav",".ogg",".aac",".mpeg"].map(x=>m+x);
  list.forEach(src=>{const so=document.createElement("source");so.src=src;audio.appendChild(so)});
  document.body.appendChild(audio);
  $("music").style.display="block";
  audio.addEventListener("play",()=>$("music").classList.add("on"));
  audio.addEventListener("pause",()=>$("music").classList.remove("on"));
  $("music").onclick=e=>{e.stopPropagation();if(audio.paused){wantPlay=true;tryPlay()}else{wantPlay=false;audio.pause()}};
}
function tryPlay(){try{const r=audio.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function startAudio(){if(audio&&audio.paused){wantPlay=true;tryPlay()}}
// بعض الموبايلات (آيفون) بتسمح بالصوت بس بعد ما الصباع يترفع — نحاول تاني
["touchend","click"].forEach(ev=>document.addEventListener(ev,()=>{if(audio&&wantPlay&&audio.paused)tryPlay()},{passive:true}));

/* ---------------- ظهور مع السكرول ---------------- */
/* ---------------- جولة تلقائية: كل جزء يظهر ويتكتب، وبعد ٣ ثواني ينزل للي بعده ---------------- */
const PAUSE=3000;                     // المدة بعد ما الأنيميشن يخلص (ملّي ثانية)
const ANIM=".reveal,.split,.write,.pop,.line-draw";
function estimate(el){
  if(el.classList.contains("portrait")) return 4200;
  if(el.classList.contains("split")){const ch=el.querySelectorAll(".ch");const n=ch.length?+ch[ch.length-1].style.getPropertyValue("--i"):0;
    return (+el.dataset.d||0)+n*(+el.dataset.sp||140)+900}
  if(el.classList.contains("write")) return 2000;
  return 1100;
}
function playStop(stop){
  const els=[stop,...stop.querySelectorAll("*")].filter(e=>e.matches(ANIM));
  let off=0,end=0;
  els.forEach(e=>{
    if(e.classList.contains("reveal")){e.classList.add("in");end=Math.max(end,off+estimate(e))}
    if(e.matches(".split,.write,.pop,.line-draw")){const t=off;setTimeout(()=>play(e),t);end=Math.max(end,t+estimate(e));off+=300}
  });
  return end;
}
let auto=true, tourTimer=null, scrollAnim=null;
function smoothTo(y,dur,done){
  const y0=scrollY, dy=y-y0, t0=performance.now();
  cancelAnimationFrame(scrollAnim);
  if(Math.abs(dy)<2){done&&done();return}
  (function f(now){const k=Math.min(1,(now-t0)/dur), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    scrollTo(0,y0+dy*e); if(k<1) scrollAnim=requestAnimationFrame(f); else done&&done()})(t0);
}
function stopY(el){const r=el.getBoundingClientRect(), h=innerHeight;
  const y=scrollY+r.top-(r.height<h-40?(h-r.height)/2:24);
  return Math.max(0,Math.min(y,document.documentElement.scrollHeight-h))}
const stops=[...document.querySelectorAll(".details .stop")];
function startTour(){
  if(!auto||document.body.classList.contains("failsafe")) return;
  let i=0;
  (function next(){
    if(!auto) return;
    if(i>=stops.length){endTour();return}
    const st=stops[i++];
    smoothTo(stopY(st),1800,()=>{ if(!auto) return; const d=playStop(st); tourTimer=setTimeout(next, d+PAUSE) });
  })();
}
function endTour(){auto=false;clearTimeout(tourTimer);cancelAnimationFrame(scrollAnim);startObserver()}
// لو الضيف سكرول بنفسه، الجولة تقف ويكمل هو براحته
const free=()=>cleared&&!document.body.classList.contains("locked");
["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>{if(auto&&free())endTour()},{passive:true}));
addEventListener("keydown",e=>{if(auto&&free()&&["ArrowDown","ArrowUp","PageDown","PageUp"," ","Home","End"].includes(e.key))endTour()});

/* لما الضيف يسكرول بنفسه: كل جزء يظهر أول ما يوصله */
let io=null;
function startObserver(){
  if(io) return;
  io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;
    el.classList.add("in");
    if(el.matches(".split,.write,.pop,.line-draw"))play(el);
    el.querySelectorAll(".split,.write,.pop,.line-draw").forEach(play);
    io.unobserve(el)}),{threshold:.2});
  document.querySelectorAll(".details .reveal, .details .split, .details .write, .details .pop, .details .line-draw, .closing-sign").forEach(el=>io.observe(el));
}

/* ---------------- العد التنازلي ---------------- */
function setNum(id,v){const el=$(id),t=toArDigits(String(v).padStart(2,"0"));if(el.textContent!==t){el.textContent=t;el.classList.remove("tick");void el.offsetWidth;el.classList.add("tick")}}
function tick(){
  const diff=target-new Date();
  if(diff<=0){$("cd-wrap").innerHTML='<div class="cd-done">'+(diff>-WEDDING.durationHours*36e5?"الفرح النهارده! 🎉":"ألف مبروك 💍")+"</div>";return clearInterval(timer)}
  setNum("cd-d",Math.floor(diff/864e5));setNum("cd-h",Math.floor(diff/36e5)%24);
  setNum("cd-m",Math.floor(diff/6e4)%60);setNum("cd-s",Math.floor(diff/1e3)%60);
}
const timer=setInterval(tick,1000);tick();

/* ---------------- تقويم ---------------- */
$("cal-btn").onclick=()=>{
  const f=d=>d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const end=new Date(target.getTime()+WEDDING.durationHours*36e5);
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//wedding//AR","BEGIN:VEVENT","UID:hesham-bassant-wedding","DTSTAMP:"+f(new Date()),
    "DTSTART:"+f(target),"DTEND:"+f(end),`SUMMARY:فرح ${WEDDING.groomShort} و ${WEDDING.brideShort}`,`LOCATION:${WEDDING.venue} - ${WEDDING.address}`,
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:الفرح بكرة!","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="wedding.ics";a.click();
};

/* ---------------- مشاركة ---------------- */
$("share-btn").onclick=async()=>{
  const data={title:document.title,text:"في دعوة مستخبية تحت اللمعة… المسها وشوف ✨",url:location.href};
  try{if(navigator.share)await navigator.share(data);else window.open("https://wa.me/?text="+encodeURIComponent(data.text+"\n"+data.url),"_blank")}catch(e){}
};
window.__inviteOK=true;
</script>
